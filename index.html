<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Lista de Compras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="cabecalho">
      <div class="cabecalho-titulo">
        <h1>🧺 Lista de Compras</h1>
        <div class="cabecalho-acoes">
          <button class="botao-icone" id="botao-compartilhar" aria-label="Compartilhar lista" hidden>📤</button>
          <button class="botao-icone" id="botao-tema" aria-label="Alternar modo escuro">🌙</button>
        </div>
      </div>
      <div class="progresso" id="progresso">
        <div class="progresso-texto" id="progresso-texto">0 de 0 comprados</div>
        <div class="progresso-barra">
          <div class="progresso-preenchido" id="progresso-preenchido"></div>
        </div>
      </div>
      <input
        type="search"
        id="input-busca"
        class="input-busca"
        placeholder="🔎 Buscar item..."
        autocomplete="off"
      />
    </header>

    <div class="filtros" id="filtros">
      <button class="filtro filtro-ativo" data-categoria="todos">Todos</button>
      <button class="filtro" data-categoria="hortifruti">🥦 Hortifruti</button>
      <button class="filtro" data-categoria="laticinios">🧀 Laticínios</button>
      <button class="filtro" data-categoria="limpeza">🧽 Limpeza</button>
      <button class="filtro" data-categoria="higiene">🧴 Higiene</button>
      <button class="filtro" data-categoria="outros">📦 Outros</button>
    </div>

    <section class="perto-de-mim" id="perto-de-mim">
      <div class="perto-cabecalho">
        <h2>📍 Perto de mim</h2>
        <button class="botao-perto-toggle" id="botao-perto-toggle">Ativar</button>
      </div>

      <div class="perto-config" id="perto-config" hidden>
        <div class="perto-tipos" id="perto-tipos">
          <button class="tipo-chip tipo-ativo" data-tipo="mercado">🛒 Mercado</button>
          <button class="tipo-chip tipo-ativo" data-tipo="padaria">🥖 Padaria</button>
          <button class="tipo-chip tipo-ativo" data-tipo="farmacia">💊 Farmácia</button>
          <button class="tipo-chip tipo-ativo" data-tipo="oficina">🔧 Oficina</button>
        </div>
        <label for="select-raio">Avisar quando estiver a menos de:</label>
        <select id="select-raio" class="select-raio">
          <option value="200">200 m</option>
          <option value="500" selected>500 m</option>
          <option value="1000">1 km</option>
        </select>
      </div>

      <p class="perto-status" id="perto-status"></p>
      <ul class="perto-lista" id="perto-lista"></ul>
    </section>

    <main class="lista-container">
      <ul class="lista" id="lista"></ul>
      <p class="mensagem-vazia" id="mensagem-vazia">Sua lista está vazia. Adicione o primeiro item abaixo! 👇</p>
    </main>

    <button class="botao-limpar" id="botao-limpar" hidden>🗑️ Limpar comprados</button>
  </div>

  <form class="barra-adicionar" id="form-adicionar">
    <input
      type="text"
      id="input-item"
      class="input-item"
      placeholder="Adicionar em Outros..."
      autocomplete="off"
      required
    />
    <button type="button" class="botao-voz" id="botao-voz" aria-label="Adicionar por voz">🎤</button>
    <div class="stepper">
      <button type="button" class="stepper-botao" id="qtd-menos" aria-label="Diminuir quantidade">−</button>
      <span class="stepper-valor" id="qtd-valor">1</span>
      <button type="button" class="stepper-botao" id="qtd-mais" aria-label="Aumentar quantidade">+</button>
    </div>
    <button type="submit" class="botao-adicionar" aria-label="Adicionar">➕</button>
  </form>

  <script src="script.js"></script>
  <script src="proximidade.js"></script>
  <script src="voz.js"></script>
</body>
</html>
